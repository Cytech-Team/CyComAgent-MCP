name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', '1.24.x', '1.25.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - run: go vet ./...

  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse POSIX bootstrap and NEA scripts
        run: sh -n scripts/bootstrap.sh scripts/bootstrap-termux.sh scripts/install-launchd.sh scripts/nea-apply.sh scripts/build-termux-tunnel.sh scripts/nea-publish-termux-tunnel.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o cycomagent ./cmd/cycomagent
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o cycomagent-root ./cmd/cycomagent-root
          file cycomagent cycomagent-root

  termux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: make build-termux
      - run: TUNNEL_CLIENT_REF=v0.0.15 make build-termux-tunnel
      - run: file dist/cycomagent-termux-arm64 dist/tunnel-client-runtime-termux-arm64
      - run: grep -q '^nea_profile=termux-arm64/tunnel-client$' dist/TUNNEL_CLIENT_UPSTREAM
      - uses: actions/upload-artifact@v4
        with:
          name: cycomagent-termux-arm64
          path: dist/cycomagent-termux-arm64

  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Parse macOS installer
        run: sh -n scripts/bootstrap.sh scripts/install-launchd.sh
      - run: go test ./...
      - run: go vet ./...
      - run: make build-macos
      - run: file dist/cycomagent-macos-arm64 dist/cycomagent-macos-amd64

  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem platform/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($null -ne $errors -and $errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }
