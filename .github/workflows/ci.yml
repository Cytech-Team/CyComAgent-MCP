name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', '1.24.x', '1.25.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      - run: go vet ./...

  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse POSIX bootstrap scripts
        run: sh -n scripts/bootstrap.sh scripts/bootstrap-termux.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o cycomagent ./cmd/cycomagent
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o cycomagent-root ./cmd/cycomagent-root
          file cycomagent cycomagent-root

  termux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: make build-termux
      - run: file dist/cycomagent-termux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cycomagent-termux-arm64
          path: dist/cycomagent-termux-arm64

  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem platform/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($null -ne $errors -and $errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }
