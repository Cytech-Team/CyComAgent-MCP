name: unified-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build unified release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify source and scripts
        run: |
          ./cycom detect
          sh -n scripts/*.sh
          bash -n cycom
      - name: Test and build every supported platform
        run: ./cycom release
      - name: Verify release assets
        run: |
          test -s dist/CyComAgent-MCP-v"$(cat internal/buildinfo/VERSION)"-linux-amd64.tar.gz
          test -s dist/CyComAgent-MCP-v"$(cat internal/buildinfo/VERSION)"-termux-arm64.tar.gz
          test -s dist/CyComAgent-MCP-v"$(cat internal/buildinfo/VERSION)"-macos-arm64.tar.gz
          test -s dist/CyComAgent-MCP-v"$(cat internal/buildinfo/VERSION)"-macos-amd64.tar.gz
          test -s dist/CyComAgent-MCP-v"$(cat internal/buildinfo/VERSION)"-windows.zip
          test -s dist/SHA256SUMS-sync
          test -s dist/cycomagent-linux-amd64
          test -s dist/cycomagent-root-linux-amd64
          test -s dist/cycomagent-android-arm64
          (cd dist && sha256sum -c SHA256SUMS-sync)
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
